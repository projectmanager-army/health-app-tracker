services:
  - type: web
    name: honolulu-training-tracker
    runtime: python
    plan: free
    buildCommand: "true"
    startCommand: "python3 server/server.py"
    envVars:
      - key: OURA_PERSONAL_ACCESS_TOKEN
        sync: false
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_REDIRECT_URI
        sync: false
      - key: STRAVA_REFRESH_TOKEN
        sync: false
      - key: USDA_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
